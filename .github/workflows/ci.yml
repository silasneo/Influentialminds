name: CI

on:
  push:
    branches: [main, prod-deploy]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish the first release before the one-time private content import
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod-deploy' }}

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      # Only needed to satisfy config parsing at build time; no database is reached.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/influential_minds
      AUTH_SECRET: ci-placeholder-secret-value-at-least-32-chars
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Validate deployment scripts
        run: |
          bash -n deploy/release.sh
          node --check deploy/import-local.mjs

      - name: Build
        run: pnpm build

  migrations:
    name: Validate schema and migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: influential_minds
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/influential_minds
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Confirm the committed migrations reproduce the schema
        run: >-
          pnpm --filter @influential-minds/api exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$DATABASE_URL"
          --exit-code

  images:
    name: ${{ inputs.publish_only && 'Publish initial release images' || 'Build and deploy release images' }}
    # The deployable artefact is the container, not the workspace build, so it
    # is verified on the branch production is cut from.
    if: github.ref == 'refs/heads/prod-deploy'
    needs: [verify, migrations]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration
        if: vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.EC2_DEPLOY_BUCKET }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_ROLE" == arn:aws:iam::"$AWS_ACCOUNT_ID":role/* ]]
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$DEPLOY_BUCKET" =~ ^[a-z0-9.-]+$ ]]
          [[ "$SITE_URL" =~ ^https://[a-z0-9.-]+$ ]]
          [[ "$API_URL" == "$SITE_URL" ]]

      - name: Authenticate to AWS with GitHub OIDC
        if: vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Log in to ECR
        if: vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/influential-minds/api:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/influential-minds/web:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}

      - name: Publish deployment bundle and deploy through SSM
        if: vars.EC2_DEPLOY_ENABLED == 'true' || inputs.publish_only
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          DEPLOY_BUCKET: ${{ vars.EC2_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          set -euo pipefail
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'API_IMAGE=%s/influential-minds/api:%s\nWEB_IMAGE=%s/influential-minds/web:%s\n' \
            "$ECR_REGISTRY" "$release_id" "$ECR_REGISTRY" "$release_id" > release.env
          tar -czf release.tar.gz docker-compose.production.yml deploy/Caddyfile deploy/release.sh deploy/import-local.mjs release.env
          aws s3 cp release.tar.gz "s3://$DEPLOY_BUCKET/releases/$release_id.tar.gz" --sse AES256 --only-show-errors
          if [[ "$PUBLISH_ONLY" == "true" ]]; then
            echo "Published initial release $release_id. Complete the private content import before enabling continuous deployment."
            exit 0
          fi
          command_id=$(aws ssm send-command \
            --document-name InfluentialMinds-Deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "{\"ReleaseId\":[\"$release_id\"]}" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>ssm-error.txt) || {
              if grep -q InvocationDoesNotExist ssm-error.txt; then sleep 5; continue; fi
              cat ssm-error.txt >&2
              exit 1
            }
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1 ;;
            esac
          done
          echo "Deployment timed out; inspect SSM command $command_id before retrying." >&2
          exit 1

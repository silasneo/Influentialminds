# Local preview stack: MySQL, the NestJS API and the Next.js site.
#
#   docker compose up --build
#
# Site        http://localhost:3000
# API         http://localhost:4000/api/v1
# Admin       http://localhost:3000/admin
#
# Host ports can be moved with WEB_PORT, API_PORT and DB_PORT in a root `.env`
# file, which matters on a machine already running something on those ports.
# Changing WEB_PORT or API_PORT needs `--build`: the browser-facing URLs are
# compiled into the web bundle.
#
# The values below are deliberately weak development defaults. Nothing here is
# suitable for a deployed environment - see docs/deployment.md.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: influential
      MYSQL_DATABASE: influential_minds
      MYSQL_USER: influential
      MYSQL_PASSWORD: influential
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Not 3306 on the host, so a MySQL already running locally is undisturbed.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-pinfluential",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_URL: http://localhost:${API_PORT:-4000}
      DATABASE_URL: mysql://influential:influential@db:3306/influential_minds
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      AUTH_SECRET: local-development-secret-not-for-deployment-32
      AUTH_COOKIE_SECURE: "false"
      IP_HASH_SALT: local-development-salt
      AI_PROVIDER: mock
      STORAGE_LOCAL_ROOT: storage
      SEED_ADMIN_EMAIL: admin@influentialminds.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
      SEED_ADMIN_NAME: Influential Minds Admin
    # Migrations and the seed run before the server starts, so a fresh volume
    # comes up with renderable content instead of an empty site.
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy &&
             node_modules/.bin/tsx prisma/seed.ts &&
             node dist/main.js"
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - media:/repo/apps/api/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/site/settings').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The browser reaches the API on localhost; this container reaches it on
      # the compose network.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
  media:
